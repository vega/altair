name: Generate offline dashboard HTML

on:
  push:
    branches:
      - docs/standalone-interactive-dashboard-3199

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Altair and offline renderer
        run: python -m pip install -e . pandas vl-convert-python
      - name: Generate and validate HTML from the documented example
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          doc = Path("doc/user_guide/saving_charts.rst").read_text()
          section = doc.index("Interactive dashboard in a single HTML file")
          start = doc.index("    import altair as alt", section)
          stop = doc.index("\nOpen ``dashboard.html``", start)
          code = textwrap.dedent(doc[start:stop]).strip()
          exec(compile(code, "saving_charts_dashboard_example", "exec"), {})
          html = Path("dashboard.html").read_text()
          if len(html) < 100000 or "vegaEmbed" not in html:
              raise AssertionError("Offline JavaScript was not embedded")
          if "<script src=" in html.lower():
              raise AssertionError("Offline HTML unexpectedly references an external script")
          output = Path("doc/_static/dashboard.html")
          output.write_text(html)
          Path("dashboard.html").unlink()
          print(f"Generated {output}: {len(html)} characters, standalone HTML")
          PY
      - name: Commit generated HTML in fork branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/_static/dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'docs: add generated standalone dashboard HTML (#4178)'
          git push origin HEAD:docs/standalone-interactive-dashboard-3199
