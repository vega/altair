name: Generate offline dashboard HTML

on:
  push:
    branches:
      - docs/standalone-interactive-dashboard-3199

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Altair and offline renderer
        run: python -m pip install -e . pandas vl-convert-python
      - name: Generate and validate HTML from the documented example
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          doc = Path("doc/user_guide/saving_charts.rst").read_text()
          section = doc.index("Interactive dashboard in a single HTML file")
          start = doc.index("    import altair as alt", section)
          stop = doc.index("\nOpen ``dashboard.html``", start)
          code = textwrap.dedent(doc[start:stop]).strip()
          exec(compile(code, "saving_charts_dashboard_example", "exec"), {})
          html = Path("dashboard.html").read_text()
          if len(html) < 100000 or "vegaEmbed" not in html:
              raise AssertionError("Offline JavaScript was not embedded")
          if "<script src=" in html.lower():
              raise AssertionError("Offline HTML unexpectedly references an external script")
          output = Path("doc/_static/dashboard.html")
          output.write_text(html)
          Path("dashboard.html").unlink()
          print(f"Generated {output}: {len(html)} characters, standalone HTML")
          PY
      - name: Verify dashboard renders completely offline in Chromium
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          html_url = Path("doc/_static/dashboard.html").resolve().as_uri()
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1360, "height": 860})
              errors = []
              page.on("pageerror", lambda error: errors.append("pageerror: " + str(error)))
              page.on("console", lambda msg: errors.append("console: " + msg.text) if msg.type == "error" else None)
              page.route("https://**", lambda route: route.abort())
              page.route("http://**", lambda route: route.abort())
              page.goto(html_url, wait_until="load")
              page.wait_for_timeout(3500)
              page.screenshot(path="dashboard-browser-validation.png", full_page=True)
              print("DOM:", page.locator("#vis").inner_html()[:1500])
              print("Elements:", {key: page.locator(key).count() for key in [".vega-embed", "canvas", "svg", "select", "input[type=search]", "input[type=range]"]})
              print("Errors:", errors)
              assert page.locator("#vis canvas, #vis svg").count() >= 1, "Vega chart not rendered"
              assert page.locator("select").count() >= 1
              assert page.locator("input[type=search]").count() >= 1
              assert page.locator("input[type=range]").count() >= 1
              assert not errors, errors
              print("PASS: 2 charts and 3 controls rendered without network")
              browser.close()
          PY
      - name: Archive browser validation screenshot
        uses: actions/upload-artifact@v4
        with:
          name: offline-dashboard-browser-validation
          path: dashboard-browser-validation.png
          retention-days: 14
      - name: Commit generated HTML in fork branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/_static/dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m 'docs: add generated standalone dashboard HTML (#4178)'
          git push origin HEAD:docs/standalone-interactive-dashboard-3199
