---
name: Publish Documentation

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to document
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to document
        default: main
        required: true
        type: string

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: 1
  UV_FROZEN: 1

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --frozen --all-extras
      - name: Publish official docs
        env:
          DOCS_PUBLISH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${DOCS_PUBLISH_TOKEN}@github.com/".insteadOf "https://github.com/"
          uv run task doc-build -- --clean
          uv run task doc-publish
