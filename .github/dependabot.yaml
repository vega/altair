version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      uv-MAJOR:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      uv-minor:
        applies-to: "version-updates"
        patterns:
          - "*"
      uv-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    commit-message:
      prefix: "build"
